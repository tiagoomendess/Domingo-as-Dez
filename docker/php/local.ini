memory_limit=512M
upload_max_filesize=64M
post_max_size=64M
max_execution_time=120
display_errors=On
display_startup_errors=On
error_reporting=E_ALL
date.timezone=UTC

; Avoid repeated path lookups. Default ttl is 120s and the default size
; is too small once Composer's classmap is in play.
realpath_cache_size=8192K
realpath_cache_ttl=600

opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=65407
; Check timestamps on every request so edits show up immediately.
; This stays cheap because vendor/ is not on the Windows bind mount.
opcache.validate_timestamps=1
opcache.revalidate_freq=0
opcache.enable_file_override=1
opcache.save_comments=1
