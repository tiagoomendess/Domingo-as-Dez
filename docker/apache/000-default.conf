<VirtualHost *:8000>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    EnableSendfile Off
    EnableMMAP Off

    # Serve Laravel public-disk files without relying on public/storage
    # (Windows junctions/symlinks do not work inside this container).
    Alias /storage /var/www/html/storage/app/public

    <Directory /var/www/html/public>
        Options +FollowSymLinks -MultiViews -Indexes
        # Skip .htaccess lookups. On a Windows bind mount each lookup is a
        # round trip out of the VM, and Apache does one per directory.
        AllowOverride None
        Require all granted

        RewriteEngine On

        # Handle Authorization Header
        RewriteCond %{HTTP:Authorization} .
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

        # Redirect Trailing Slashes If Not A Folder...
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_URI} (.+)/$
        RewriteRule ^ %1 [L,R=301]

        # Handle Front Controller...
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </Directory>

    <Directory /var/www/html/storage/app/public>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
