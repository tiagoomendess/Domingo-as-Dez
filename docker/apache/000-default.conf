<VirtualHost *:8000>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    EnableSendfile Off
    EnableMMAP Off

    # Serve Laravel public-disk files without relying on public/storage
    # (Windows junctions/symlinks do not work inside this container).
    Alias /storage /var/www/html/storage/app/public

    <Directory /var/www/html/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html/storage/app/public>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
