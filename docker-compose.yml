services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_URL: http://localhost:8000
      # Reaches MySQL published on the host (your existing Docker MySQL).
      # If MySQL is on a shared Docker network instead, override:
      #   DOCKER_DB_HOST=mysql_container_name docker compose up
      DB_HOST: ${DOCKER_DB_HOST:-host.docker.internal}
