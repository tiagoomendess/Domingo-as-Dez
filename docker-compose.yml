services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    # No CPU or memory cap: the container can use the whole Docker VM.
    # VM size is %USERPROFILE%\.wslconfig (24GB RAM, all 16 threads).
    shm_size: "1gb"
    volumes:
      - .:/var/www/html
      # These two stay on the Linux disk inside the Docker VM.
      # A Windows bind mount makes every PHP stat() take milliseconds, and
      # Laravel touches thousands of files in vendor/ on each request.
      - vendor:/var/www/html/vendor
      - framework:/var/www/html/storage/framework
      # Mounted so Apache config edits only need a container restart, not a rebuild.
      - ./docker/apache/000-default.conf:/etc/apache2/sites-available/000-default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_URL: http://localhost:8000
      # Reaches MySQL published on the host (your existing Docker MySQL).
      # If MySQL is on a shared Docker network instead, override:
      #   DOCKER_DB_HOST=mysql_container_name docker compose up
      DB_HOST: ${DOCKER_DB_HOST:-host.docker.internal}
      # Read from .env; Apache redirects /storage files missing on disk here.
      R2_URL: ${R2_URL:-}

volumes:
  vendor:
  framework:
